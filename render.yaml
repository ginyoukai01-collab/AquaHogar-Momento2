services:
  - type: web
    name: aquahogar-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.init_db && python -m backend.seed && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aquahogar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: IOT_API_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: ADMIN_NAME
        value: Administrador AquaHogar
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER_NAME
        value: Usuario AquaHogar
      - key: DEMO_USER_EMAIL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false

databases:
  - name: aquahogar-db
    plan: free
    databaseName: aquahogar
    user: aquahogar
